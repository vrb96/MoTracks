<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoTracks - Inicio de Sesión</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen flex flex-col">

    <nav class="bg-black text-white p-4 shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold tracking-wider text-yellow-500">MOTRACKS</h1>
            <span class="text-sm italic">Panel de Control de Taller</span>
        </div>
    </nav>

    <main class="flex-1 flex items-center justify-center p-4">
        <div class="w-full max-w-md bg-white rounded-xl shadow-lg p-8">
            <div class="text-center mb-8">
                <h2 class="text-3xl font-bold text-gray-800">Iniciar Sesión</h2>
                <p class="text-gray-500 mt-2">¡Vamos al taller!</p>
            </div>

            <form id="login-form" class="space-y-5">
                <div>
                    <label for="login-email" class="block text-sm font-medium text-gray-700 mb-2">
                        Correo electrónico
                    </label>
                    <input
                        type="email"
                        id="login-email"
                        placeholder="usuario@motracks.com"
                        class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-500 focus:border-yellow-500"
                        required
                    >
                </div>

                <div>
                    <label for="login-password" class="block text-sm font-medium text-gray-700 mb-2">
                        Contraseña
                    </label>
                    <input
                        type="password"
                        id="login-password"
                        placeholder="********"
                        class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-500 focus:border-yellow-500"
                        required
                    >
                </div>

                <button
                    type="submit"
                    class="w-full bg-yellow-500 text-black font-bold py-3 rounded-lg hover:bg-yellow-600 transition"
                >
                    ENTRAR
                </button>
            </form>

            <div class="mt-6 text-center">
                <p class="text-sm text-gray-600">
                    ¿No tienes cuenta?
                    <a href="registro.html" class="text-yellow-600 font-semibold hover:underline">
                        Regístrate
                    </a>
                </p>
            </div>

            <p id="message" class="mt-5 text-center text-sm font-medium"></p>
        </div>
    </main>

    <script type="module">
        import {
            login,
            getCurrentUser,
            redirectByRole,
            redirectIfSessionExists
        } from '../js/auth.js';

        const loginForm = document.getElementById('login-form');
        const message = document.getElementById('message');

        function showMessage(text, colorClass) {
            message.textContent = text;
            message.className = `mt-5 text-center text-sm font-medium ${colorClass}`;
        }

        loginForm.addEventListener('submit', async function (event) {
            event.preventDefault();

            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value.trim();

            if (!email || !password) {
                showMessage('Completa correo y contraseña.', 'text-red-600');
                return;
            }

            showMessage('Iniciando sesión...', 'text-blue-600');

            const { error } = await login(email, password);

            if (error) {
                console.error('Error de login:', error);
                showMessage(error.message, 'text-red-600');
                return;
            }

            const { user, error: userError } = await getCurrentUser();

            if (userError || !user) {
                console.error('Error al obtener usuario autenticado:', userError);
                showMessage('No se pudo verificar el usuario autenticado.', 'text-red-600');
                return;
            }

            const result = await redirectByRole(user.id);

            if (!result.ok) {
                showMessage(result.message || 'No se pudo redirigir al panel correspondiente.', 'text-red-600');
                return;
            }

            showMessage('Acceso correcto. Redirigiendo...', 'text-green-600');
        });

        window.addEventListener('load', async () => {
            try {
                await redirectIfSessionExists();
            } catch (error) {
                console.error('Error al revisar sesión activa:', error);
            }
        });
    </script>

</body>
</html>
