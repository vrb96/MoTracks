<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoTracks - Registro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen flex flex-col">

    <nav class="bg-black text-white p-4 shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold tracking-wider text-yellow-500">MOTRACKS</h1>
            <span class="text-sm italic">Panel de Control de Taller</span>
        </div>
    </nav>

    <main class="flex-1 flex items-center justify-center p-4">
        <div class="w-full max-w-md bg-white rounded-xl shadow-lg p-8">
            <div class="text-center mb-8">
                <h2 class="text-3xl font-bold text-gray-800">Crear Cuenta</h2>
                <p class="text-gray-500 mt-2">Registra tu cuenta para acceder al sistema</p>
            </div>

            <form id="register-form" class="space-y-5">
                <div>
                    <label for="register-name" class="block text-sm font-medium text-gray-700 mb-2">
                        Nombre completo
                    </label>
                    <input
                        type="text"
                        id="register-name"
                        placeholder="Tu nombre completo"
                        class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-500 focus:border-yellow-500"
                        required
                    >
                </div>

                <div>
                    <label for="register-email" class="block text-sm font-medium text-gray-700 mb-2">
                        Correo electrónico
                    </label>
                    <input
                        type="email"
                        id="register-email"
                        placeholder="usuario@motracks.com"
                        class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-500 focus:border-yellow-500"
                        required
                    >
                </div>

                <div>
                    <label for="register-password" class="block text-sm font-medium text-gray-700 mb-2">
                        Contraseña
                    </label>
                    <input
                        type="password"
                        id="register-password"
                        placeholder="********"
                        class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-500 focus:border-yellow-500"
                        required
                    >
                </div>

                <div>
                    <label for="register-confirm-password" class="block text-sm font-medium text-gray-700 mb-2">
                        Confirmar contraseña
                    </label>
                    <input
                        type="password"
                        id="register-confirm-password"
                        placeholder="********"
                        class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-500 focus:border-yellow-500"
                        required
                    >
                </div>

                <button
                    type="submit"
                    class="w-full bg-yellow-500 text-black font-bold py-3 rounded-lg hover:bg-yellow-600 transition"
                >
                    REGISTRARME
                </button>
            </form>

            <div class="mt-6 text-center">
                <p class="text-sm text-gray-600">
                    ¿Ya tienes cuenta?
                    <a href="index.html" class="text-yellow-600 font-semibold hover:underline">
                        Inicia sesión
                    </a>
                </p>
            </div>

            <p id="message" class="mt-5 text-center text-sm font-medium"></p>
        </div>
    </main>

    <script type="module">
        import { registerUser, redirectIfSessionExists } from '../js/auth.js';

        const registerForm = document.getElementById('register-form');
        const message = document.getElementById('message');

        function showMessage(text, colorClass) {
            message.textContent = text;
            message.className = `mt-5 text-center text-sm font-medium ${colorClass}`;
        }

        registerForm.addEventListener('submit', async function (event) {
            event.preventDefault();

            const nombre = document.getElementById('register-name').value.trim();
            const email = document.getElementById('register-email').value.trim();
            const password = document.getElementById('register-password').value.trim();
            const confirmPassword = document.getElementById('register-confirm-password').value.trim();

            if (!nombre || !email || !password || !confirmPassword) {
                showMessage('Completa todos los campos.', 'text-red-600');
                return;
            }

            if (password.length < 6) {
                showMessage('La contraseña debe tener al menos 6 caracteres.', 'text-red-600');
                return;
            }

            if (password !== confirmPassword) {
                showMessage('Las contraseñas no coinciden.', 'text-red-600');
                return;
            }

            showMessage('Registrando usuario...', 'text-blue-600');

            const { data, error } = await registerUser(nombre, email, password);

if (error) {
    showMessage(error.message, 'text-red-600');
    return;
}

registerForm.reset();
showMessage('Registro completado correctamente. Redirigiendo al inicio de sesión...', 'text-green-600');

setTimeout(() => {
    window.location.href = 'index.html';
}, 1500);
        });

        window.addEventListener('load', async () => {
            await redirectIfSessionExists();
        });
    </script>

</body>
</html>
